x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@database:5432/afcommerce}
  # Internal URLs & hostnames are fixed here so containers always resolve each
  # other regardless of what a local developer copies into .env.
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_INDEX: products
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SCRAPER_API_TOKEN: ${SCRAPER_API_TOKEN:-change-me}

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afcommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/migrations/up:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  dagster-webserver:
    build:
      context: ./dagster
    restart: unless-stopped
    environment:
      <<: *app-environment
      DAGSTER_HOME: /opt/dagster/dagster_home
      # Pin the pipeline to the compose-internal services so the local stack is
      # always self-consistent (same rationale as the ES URLs above).
      DATABASE_URL: postgresql://postgres:postgres@database:5432/afcommerce
      PRODUCTS_JSON_PATH: /workspace/input/products.json
      ES_MAPPING_PATH: /workspace/mappings/product.index.json
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -w
      - /workspace/workspace.yaml
    volumes:
      - ./dagster:/workspace
      - ./scraper/output:/workspace/input:ro
      - ./elasticsearch/mappings:/workspace/mappings:ro
      - dagster-home:/opt/dagster/dagster_home
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  dagster-daemon:
    build:
      context: ./dagster
    restart: unless-stopped
    environment:
      <<: *app-environment
      DAGSTER_HOME: /opt/dagster/dagster_home
      DATABASE_URL: postgresql://postgres:postgres@database:5432/afcommerce
      PRODUCTS_JSON_PATH: /workspace/input/products.json
      ES_MAPPING_PATH: /workspace/mappings/product.index.json
    entrypoint:
      - dagster-daemon
      - run
      - -w
      - /workspace/workspace.yaml
    volumes:
      - ./dagster:/workspace
      - ./scraper/output:/workspace/input:ro
      - ./elasticsearch/mappings:/workspace/mappings:ro
      - dagster-home:/opt/dagster/dagster_home
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  scraper:
    build:
      context: ./scraper
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      elasticsearch:
        condition: service_healthy

  api:
    build:
      context: ./apps
    restart: unless-stopped
    environment:
      <<: *app-environment
      # The compose stack is self-contained: pin the API to the internal
      # Postgres (the host .env may point at an external Supabase that the
      # container network cannot reach).
      DATABASE_URL: postgresql://postgres:postgres@database:5432/afcommerce
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # Stage 3 storefront: Next.js App Router + Payload CMS v3.
  # Port 3001 both hosts the Payload admin (http://localhost:3001/admin) and the
  # storefront (http://localhost:3001). The admin-ui is port 3000 (Dagster) so
  # this is intentionally separate.
  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      <<: *app-environment
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret-fbfa1b9f73c14baeb9b9f}
      PAYLOAD_ADMIN_EMAIL: ${PAYLOAD_ADMIN_EMAIL:-admin@summerhill.demo}
      PAYLOAD_ADMIN_PASSWORD: ${PAYLOAD_ADMIN_PASSWORD:-admin1234}
      # Pin to the compose-internal Postgres (same rationale as the api/dagster
      # services — host .env may point at an external Supabase).
      DATABASE_URI: postgresql://postgres:postgres@database:5432/afcommerce
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      api:
        condition: service_healthy

  # stripe-worker:
#   build:
#     context: ./stripe
#   restart: unless-stopped
#   environment:
#     <<: *app-environment
#   depends_on:
#     database:
#       condition: service_healthy

volumes:
  database-data:
  elasticsearch-data:
  dagster-home: